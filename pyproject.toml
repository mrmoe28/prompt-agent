[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-agent"
version = "0.1.0"
description = "A floating desktop pad that rewrites prompts, explains jargon, and gives straight advice — powered by your Claude Code CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "mrmoe28" }]
keywords = ["claude", "prompt", "cli", "tkinter", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Linux-only focus helper. The app runs without it.
x11 = ["python-xlib"]

[project.scripts]
prompt-agent = "prompt_agent.app:main"

[project.urls]
Homepage = "https://github.com/mrmoe28/prompt-agent"
Issues = "https://github.com/mrmoe28/prompt-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_agent"]
